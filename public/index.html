<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="sidebar">
    <button id="newChat" class="new-chat" data-icon="plus" data-icon-size="16"><span>Nuevo chat</span></button>
    <nav id="chatList"></nav>
    <div class="sidebar-footer">
      <span id="userEmail"></span>
      <button id="signOut" class="link">Salir</button>
    </div>
  </aside>

  <main id="main">
    <header>
      <button id="toggleSidebar" class="icon-btn" data-icon="menu" aria-label="Menú"></button>
      <span id="modelName"></span>
      <div class="header-actions">
        <button id="toggleSettings" class="icon-btn" data-icon="settings" aria-label="Ajustes"></button>
      </div>
    </header>

    <div id="settingsPanel" hidden>
      <section>
        <h2>Tema</h2>
        <div class="options" id="themeOptions">
          <button data-theme="system">Sistema</button>
          <button data-theme="light">Claro</button>
          <button data-theme="dark">Oscuro</button>
        </div>
      </section>

      <section>
        <h2>Modelo</h2>
        <select id="modelSelect"></select>
      </section>

      <section>
        <h2>Memoria del chat</h2>
        <div class="meter"><div id="memoryBar"></div></div>
        <p class="hint" id="memoryText">Sin mensajes todavía.</p>
      </section>

      <section id="apiKeySection" hidden>
        <h2>API key</h2>
        <input id="apiKey" type="password" placeholder="AIza..." autocomplete="off" spellcheck="false">
        <p class="hint">
          Se guarda solo en este navegador.
          <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Consigue una</a>
        </p>
      </section>
    </div>

    <div id="messages"></div>

    <div id="composerWrap">
      <div id="attachments"></div>
      <form id="composer">
        <input id="fileInput" type="file" multiple hidden
               accept="image/*,audio/*,video/*,application/pdf,text/*,.md,.csv,.json">
        <button id="attach" type="button" class="round-btn" data-icon="paperclip" aria-label="Adjuntar archivo"></button>
        <textarea id="input" rows="1" placeholder="Escribe un mensaje..." autocomplete="off"></textarea>
        <button id="mic" type="button" class="round-btn" data-icon="mic" aria-label="Dictar"></button>
        <button id="send" type="submit" data-icon="send" aria-label="Enviar"></button>
      </form>
      <p class="hint status" id="status"></p>
    </div>
  </main>

  <div id="authGate" class="gate hidden">
    <div class="gate-card">
      <h1>Chat</h1>
      <button id="signIn">Entrar con Google</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
