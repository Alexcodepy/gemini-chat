<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="sidebar">
    <button id="newChat" class="new-chat">+ Nuevo chat</button>
    <nav id="chatList"></nav>
    <div class="sidebar-footer">
      <span id="userEmail"></span>
      <button id="signOut" class="link">Salir</button>
    </div>
  </aside>

  <main id="main">
    <header>
      <button id="toggleSidebar" aria-label="Menú">☰</button>
      <span id="modelName"></span>
      <div class="header-actions">
        <button id="toggleSettings" aria-label="Ajustes">⚙</button>
      </div>
    </header>

    <div id="settingsPanel" hidden>
      <h2>Tema</h2>
      <div class="theme-options" id="themeOptions">
        <button data-theme="system">Sistema</button>
        <button data-theme="light">Claro</button>
        <button data-theme="dark">Oscuro</button>
      </div>
    </div>

    <div id="messages"></div>

    <form id="composer">
      <textarea id="input" rows="1" placeholder="Escribe un mensaje..." autocomplete="off"></textarea>
      <button id="send" type="submit" aria-label="Enviar">↑</button>
    </form>
  </main>

  <div id="authGate" class="gate hidden">
    <div class="gate-card">
      <h1>Chat</h1>
      <button id="signIn">Entrar con Google</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
